[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agente-supervisor"
version = "1.0.0"
description = "CLI de monitoramento: lista hosts ativos, sessões em andamento e IPs acessíveis"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agente-supervisor = "agente_supervisor.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agente_supervisor*"]
