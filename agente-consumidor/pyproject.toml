[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agente-consumidor"
version = "1.0.0"
description = "SDK para conectar automações RPA ao agente-operador via WebSocket"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
examples = [
    "qrcode>=7.0",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agente_consumidor*"]
